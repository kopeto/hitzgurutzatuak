services:

  app:
    build: .
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      - DB_CONNECTION=mongodb://mongo:27017/CW
      - NODE_ENV=development
      - PORT=3000
      - MY_SECRET=${MY_SECRET:-local-development-secret-change-me}
      - EXTERNAL_API_KEY=${EXTERNAL_API_KEY:-local-development-api-key-change-me}
      - TRUST_PROXY=false
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - uploads:/app/uploads
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mongodata:
  uploads:
