(() => {
  const COUNT = 64;
  const input = document.getElementById('answer');
  const ignoreSpaces = document.getElementById('ignoreSpaces');
  const counter = document.getElementById('counter');
  const remaining = document.getElementById('remaining');
  const warning = document.getElementById('warning');
  const svg = document.querySelector('main svg');
  const letters = Array.from({length: COUNT}, (_, i) =>
    svg.querySelector(`#LETRA_${String(i + 1).padStart(3, '0')}`)
  );

  function characters() {
    let value = input.value.toLocaleUpperCase('eu');
    if (ignoreSpaces.checked) value = value.replace(/\s+/g, '');
    else value = value.replace(/[\r\n\t]+/g, ' ');
    return Array.from(value);
  }

  function update() {
    const chars = characters();
    letters.forEach((node, i) => { node.textContent = chars[i] ?? '·'; });
    const used = Math.min(chars.length, COUNT);
    counter.textContent = `${used} / ${COUNT}`;
    remaining.textContent = `${COUNT - used} libre`;
    warning.textContent = chars.length > COUNT
      ? `${chars.length - COUNT} karaktere soberan; ez dira gridan sartuko.`
      : '';
    localStorage.setItem(`espiral-grida-${COUNT}-testua`, input.value);
    localStorage.setItem(`espiral-grida-${COUNT}-hutsuneak`, String(ignoreSpaces.checked));
  }

  input.addEventListener('input', update);
  ignoreSpaces.addEventListener('change', update);
  document.getElementById('clear').addEventListener('click', () => {
    input.value = '';
    input.focus();
    update();
  });
  document.getElementById('print').addEventListener('click', () => window.print());

  letters.forEach((node, i) => node.addEventListener('click', () => {
    input.focus();
    input.setSelectionRange(Math.min(i, input.value.length), Math.min(i, input.value.length));
  }));

  document.getElementById('download').addEventListener('click', async () => {
    update();
    const copy = svg.cloneNode(true);
    copy.removeAttribute('style');
    const xml = '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(copy);
    const blob = new Blob([xml], {type: 'image/svg+xml;charset=utf-8'});
    const filename = 'Espiral grida 64 erantzuna betea.svg';

    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: filename,
          types: [{
            description: 'SVG irudia',
            accept: {'image/svg+xml': ['.svg']}
          }]
        });
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        warning.style.color = '#187036';
        warning.textContent = 'SVG fitxategia ongi gorde da.';
        return;
      } catch (error) {
        if (error && error.name === 'AbortError') return;
        console.error(error);
      }
    }

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    warning.style.color = '#187036';
    warning.textContent = 'Deskarga abiatu da; begiratu nabigatzailearen Deskargak atala.';
  });

  const testValue = new URLSearchParams(location.search).get('test');
  input.value = testValue ?? localStorage.getItem(`espiral-grida-${COUNT}-testua`) ?? '';
  const savedSpaces = localStorage.getItem(`espiral-grida-${COUNT}-hutsuneak`);
  if (savedSpaces !== null) ignoreSpaces.checked = savedSpaces === 'true';
  update();
  document.body.dataset.ready = 'true';
})();
</script>
</body>
</html>
