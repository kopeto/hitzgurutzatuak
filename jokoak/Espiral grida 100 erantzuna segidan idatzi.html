<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Espiral grida 100 — erantzuna segidan idatzi</title>
<style>
  :root { font-family: Arial, Helvetica, sans-serif; color: #171717; background: #ecebe7; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; grid-template-columns: minmax(290px, 390px) 1fr; }
  aside { padding: 28px; background: #fff; box-shadow: 2px 0 18px #0002; z-index: 1; }
  main { min-width: 0; display: grid; place-items: center; padding: 22px; }
  h1 { margin: 0 0 8px; font-size: 1.35rem; }
  p { line-height: 1.42; color: #555; }
  label { display: block; margin: 20px 0 7px; font-weight: 700; }
  textarea { width: 100%; min-height: 170px; padding: 12px; resize: vertical; border: 2px solid #777; border-radius: 7px; font: 700 1.15rem/1.5 Consolas, monospace; text-transform: uppercase; }
  textarea:focus { outline: 3px solid #7aa7ff66; border-color: #245bb6; }
  .option { display: flex; gap: 9px; align-items: flex-start; margin: 12px 0; font-weight: 400; }
  .option input { margin-top: 3px; }
  .status { display: flex; justify-content: space-between; margin: 8px 0 18px; font-variant-numeric: tabular-nums; }
  #warning { color: #b12121; min-height: 1.3em; font-weight: 700; }
  .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  button { padding: 11px 9px; border: 1px solid #555; border-radius: 6px; background: #f7f7f7; cursor: pointer; font-weight: 700; }
  button.primary { color: #fff; border-color: #174a91; background: #245bb6; grid-column: 1 / -1; }
  button:hover { filter: brightness(.96); }
  svg { display: block; width: min(100%, 850px); height: auto; background: white; box-shadow: 0 5px 22px #0002; }
  #ERANTZUNA_EDITAGARRIA text { cursor: pointer; }
  #ERANTZUNA_EDITAGARRIA text:hover { fill: #245bb6; }
  @media (max-width: 800px) { body { grid-template-columns: 1fr; } aside { box-shadow: 0 2px 12px #0002; } main { padding: 10px; } }
  @media print { aside { display: none; } body { display: block; background: white; } main { padding: 0; } svg { width: 100%; box-shadow: none; } }
</style>
</head>

<aside>
  <h1>Espiral grida 100</h1>
  <p>Idatzi erantzuna segidan. Karaktere bakoitza automatikoki hurrengo laukian sartuko da, 1etik 100era.</p>
  <label for="answer">Erantzunaren testua</label>
  <textarea id="answer" autofocus spellcheck="false" placeholder="IDATZI HEMEN…"></textarea>
  <label class="option"><input id="ignoreSpaces" type="checkbox" checked> <span>Ez zenbatu hitzen arteko hutsuneak (gomendatua)</span></label>
  <div class="status"><span id="counter">0 / 100</span><span id="remaining">100 libre</span></div>
  <div id="warning" role="alert"></div>
  <div class="buttons">
    <button id="clear" type="button">Garbitu</button>
    <button id="print" type="button">Inprimatu</button>
    <button id="download" class="primary" type="button">SVG betea deskargatu</button>
  </div>
  <p><small>Lauki batean klik eginez gero, kurtsorea posizio horretara joango da. Deskargatutako SVGa Affinityn ireki eta <b>.af</b> gisa gorde daiteke.</small></p>
</aside>

<script>
(() => {
  const COUNT = 100;
  const input = document.getElementById('answer');
  const ignoreSpaces = document.getElementById('ignoreSpaces');
  const counter = document.getElementById('counter');
  const remaining = document.getElementById('remaining');
  const warning = document.getElementById('warning');
  const svg = document.querySelector('main svg');
  const letters = Array.from({length: COUNT}, (_, i) =>
    svg.querySelector(`#LETRA_${String(i + 1).padStart(3, '0')}`)
  );

  function characters() {
    let value = input.value.toLocaleUpperCase('eu');
    if (ignoreSpaces.checked) value = value.replace(/\s+/g, '');
    else value = value.replace(/[\r\n\t]+/g, ' ');
    return Array.from(value);
  }

  function update() {
    const chars = characters();
    letters.forEach((node, i) => { node.textContent = chars[i] ?? '·'; });
    const used = Math.min(chars.length, COUNT);
    counter.textContent = `${used} / ${COUNT}`;
    remaining.textContent = `${COUNT - used} libre`;
    warning.textContent = chars.length > COUNT
      ? `${chars.length - COUNT} karaktere soberan; ez dira gridan sartuko.`
      : '';
    localStorage.setItem(`espiral-grida-${COUNT}-testua`, input.value);
    localStorage.setItem(`espiral-grida-${COUNT}-hutsuneak`, String(ignoreSpaces.checked));
  }

  input.addEventListener('input', update);
  ignoreSpaces.addEventListener('change', update);
  document.getElementById('clear').addEventListener('click', () => {
    input.value = '';
    input.focus();
    update();
  });
  document.getElementById('print').addEventListener('click', () => window.print());

  letters.forEach((node, i) => node.addEventListener('click', () => {
    input.focus();
    input.setSelectionRange(Math.min(i, input.value.length), Math.min(i, input.value.length));
  }));

  document.getElementById('download').addEventListener('click', async () => {
    update();
    const copy = svg.cloneNode(true);
    copy.removeAttribute('style');
    const xml = '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(copy);
    const blob = new Blob([xml], {type: 'image/svg+xml;charset=utf-8'});
    const filename = 'Espiral grida 100 erantzuna betea.svg';

    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: filename,
          types: [{
            description: 'SVG irudia',
            accept: {'image/svg+xml': ['.svg']}
          }]
        });
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        warning.style.color = '#187036';
        warning.textContent = 'SVG fitxategia ongi gorde da.';
        return;
      } catch (error) {
        if (error && error.name === 'AbortError') return;
        console.error(error);
      }
    }

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    warning.style.color = '#187036';
    warning.textContent = 'Deskarga abiatu da; begiratu nabigatzailearen Deskargak atala.';
  });

  const testValue = new URLSearchParams(location.search).get('test');
  input.value = testValue ?? localStorage.getItem(`espiral-grida-${COUNT}-testua`) ?? '';
  const savedSpaces = localStorage.getItem(`espiral-grida-${COUNT}-hutsuneak`);
  if (savedSpaces !== null) ignoreSpaces.checked = savedSpaces === 'true';
  update();
  document.body.dataset.ready = 'true';
})();
</script>
</body>
