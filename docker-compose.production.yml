services:
  app:
    build: .
    env_file:
      - ${APP_ENV_FILE:-/etc/hitzgurutzatuak/app.env}
    environment:
      NODE_ENV: production
      APP_MODE: ${APP_MODE:-production}
      PORT: "3000"
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-3000}:3000"
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mongodata:
  uploads:
