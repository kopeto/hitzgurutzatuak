name: hitzgurutzatuak-develop

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.develop
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DB_CONNECTION: mongodb://mongo:27017/HG_develop
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: "3000"
      MY_SECRET: local-development-secret-change-me
      EXTERNAL_API_KEY: local-development-api-key-change-me
      TRUST_PROXY: "false"
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - uploads:/app/uploads
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mongodata:
    name: hitzgurutzatuak_develop_mongodata
  uploads:
    name: hitzgurutzatuak_develop_uploads
